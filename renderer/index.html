<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>먼작귀</title><link rel="stylesheet" href="widget.css">
  <script src="../node_modules/lucide/dist/umd/lucide.min.js" defer></script><script src="web-bridge.js" defer></script><script src="characters.js" defer></script><script src="widget.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <time id="clock">00:00</time><span id="status" class="status">출근 전</span><span id="previewBadge" class="preview-label" hidden>미리보기</span>
    <div class="time-info"><span id="remaining"></span><span id="secondary"></span></div>
    <div class="tools">
      <button id="sound" title="소리 켜기" aria-label="소리 켜기" aria-pressed="false"><i data-lucide="volume-x"></i></button>
      <button id="mini" title="미니 모드" aria-label="미니 모드" aria-pressed="false"><i data-lucide="minimize-2"></i></button>
      <button id="settings" title="설정" aria-label="SET 설정"><i data-lucide="settings-2"></i></button>
      <button id="pin" title="항상 위에" aria-label="PIN 항상 위에" aria-pressed="false"><i data-lucide="pin"></i></button>
      <button id="hide" title="트레이로 숨기기" aria-label="HIDE 트레이로 숨기기"><i data-lucide="minus"></i></button>
      <button id="quit" title="종료" aria-label="QUIT 종료"><i data-lucide="x"></i></button>
    </div>
  </header>
  <div class="progress" role="progressbar" aria-label="업무 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill"></span></div>
  <main id="scene" class="scene" aria-label="먼작귀 친구들의 정원">
    <div class="landscape day" aria-hidden="true"></div><div id="sunset" class="landscape sunset" aria-hidden="true"></div><div id="night" class="landscape night" aria-hidden="true"></div>
    <div id="story" class="story" role="status" aria-live="polite" hidden></div>
    <div id="food" class="food" aria-hidden="true" hidden></div>
    <button class="character" data-character="chiikawa" aria-label="치이카와 쓰다듬기" title="치이카와" hidden><span class="pet-shadow"></span><canvas class="sprite" width="300" height="340" aria-hidden="true"></canvas><span class="speech" hidden></span></button>
    <button class="character" data-character="hachiware" aria-label="하치와레 쓰다듬기" title="하치와레" hidden><span class="pet-shadow"></span><canvas class="sprite" width="300" height="340" aria-hidden="true"></canvas><span class="speech" hidden></span></button>
    <button class="character" data-character="usagi" aria-label="우사기 쓰다듬기" title="우사기" hidden><span class="pet-shadow"></span><canvas class="sprite" width="300" height="340" aria-hidden="true"></canvas><span class="speech" hidden></span></button>
    <button class="character" data-character="momonga" aria-label="모몽가 쓰다듬기" title="모몽가" hidden><span class="pet-shadow"></span><canvas class="sprite" width="300" height="340" aria-hidden="true"></canvas><span class="speech" hidden></span></button>
    <div id="hearts" class="hearts" aria-hidden="true"></div>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
</body>
</html>
